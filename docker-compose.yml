services:
  schach-bot:
    build: .
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID:-0}
      - CHANNEL_ID=${CHANNEL_ID}
      # Spiegel-Channels fuer das Tagespuzzle (ID oder ID:sprache, komma-getrennt); leer = nur CHANNEL_ID.
      - DAILY_EXTRA_CHANNEL_IDS=${DAILY_EXTRA_CHANNEL_IDS:-}
      - DAILY_DEFAULT_LANG=${DAILY_DEFAULT_LANG:-de}
      - LICHESS_TOKEN=${LICHESS_TOKEN}
      - ROOKHUB_API_URL=${ROOKHUB_API_URL}
      - ROOKHUB_WEB_URL=${ROOKHUB_WEB_URL}
      - ROOKHUB_LINK_SECRET=${ROOKHUB_LINK_SECRET:-}
      # Stats-Secret für /motivation. == RookHubs SCHACH_BOT_STATS_SECRET; leer = /motivation deaktiviert.
      - ROOKHUB_STATS_SECRET=${ROOKHUB_STATS_SECRET:-}
      - BOOKS_DIR=books
      - PUZZLE_HOUR=${PUZZLE_HOUR:-9}
      - PUZZLE_MINUTE=${PUZZLE_MINUTE:-0}
      - TOURNAMENT_CHANNEL_ID=${TOURNAMENT_CHANNEL_ID:-0}
      - WOCHENPOST_CHANNEL_ID=${WOCHENPOST_CHANNEL_ID:-0}
      - LIBRARY_INDEX=/app/library/index.txt
      # Gemeinfreiheits-Sperre (1/true/yes/on); leer = aus.
      - LIBRARY_ENFORCE_PD=${LIBRARY_ENFORCE_PD:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - SFTPGO_BASE_URL=${SFTPGO_BASE_URL}
      - SFTPGO_SHARE_ID=${SFTPGO_SHARE_ID}
      - SFTPGO_SHARE_PASSWORD=${SFTPGO_SHARE_PASSWORD}
      # RookHub-Webhook (Solver-Updates). Secret == RookHubs SCHACH_BOT_WEBHOOK_SECRET; leer = deaktiviert.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      # Elasticsearch-Logging (optional). Leer = deaktiviert.
      - ES_URL=${ES_URL:-}
      - ES_INDEX_PREFIX=${ES_INDEX_PREFIX:-schach-bot-logs}
    # WEBHOOK_BIND_HOST bewusst nicht durchgereicht: im Container fest 0.0.0.0 (sonst erreicht
    # das Port-Mapping den Webhook nicht). Ausnahme in tests/test_compose_env.py.
    ports:
      # Host-Port (= Port in der RookHub-URL) -> fester Container-Port 9000. Erreichbar via Host-IP.
      - "${WEBHOOK_PORT:-9000}:9000"
    volumes:
      - ./config:/app/config
      - ./books:/app/books
      - ./library:/app/library
    mem_limit: 512m
    cpus: 0.5
