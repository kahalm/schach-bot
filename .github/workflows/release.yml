name: Release Docker Image

on:
  push:
    branches:
      - main
    # Nur Release-Marken vX.Y.Z (Review W2 I1-004): ein Sicherungs-Tag wie
    # vorher-umbau oder v-test baut kein Image. Job release-guard prueft das
    # noch einmal und verlangt, dass der markierte Commit auf main liegt.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # :latest zieht Watchtower nachts auf Prod. Ein Tag gibt nur frei, wenn er
  # genau vX.Y.Z heisst und sein Commit auf main liegt (kein ungemergter
  # Branch-Stand nach Prod); main-Pushes bauen weiter nur :dev.
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tag-check.outputs.latest }}

    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 0

      - name: Tag ist vX.Y.Z und liegt auf main
        id: tag-check
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME ist keine Release-Marke vX.Y.Z - kein Image."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) liegt nicht auf main - kein Image."
            exit 1
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"

  # Kein Image ohne gruene Tests: :dev (main) und :latest (Tag) zieht
  # Watchtower nachts auf Dev/Prod. Gleicher Befehl wie lokal (CLAUDE.md).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # rlPyCairo/pycairo bauen gegen libcairo (wie im Dockerfile)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_trim.py meldet hier SKIP: books/*_firstkey.pgn ist gitignored,
      # die Snapshot-Regression laeuft nur lokal (NEEDS_BOOKS in run_all.py).
      - name: Run all offline tests
        run: python tests/run_all.py

  build-and-push:
    needs: [release-guard, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.release-guard.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
