name: Release Docker Image

on:
  push:
    branches:
      - main
    # Nur Release-Marken vX.Y.Z (Review W2 I1-004): ein Sicherungs-Tag wie
    # vorher-umbau oder v-test baut kein Image. Job release-guard prueft das
    # noch einmal und verlangt, dass der markierte Commit auf main liegt.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # :latest zieht Watchtower nachts auf Prod. Ein Tag gibt nur frei, wenn er
  # genau vX.Y.Z heisst und sein Commit auf main liegt (kein ungemergter
  # Branch-Stand nach Prod); main-Pushes bauen weiter nur :dev.
  release-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tag-check.outputs.latest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 0

      - name: Tag ist vX.Y.Z und liegt auf main
        id: tag-check
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME ist keine Release-Marke vX.Y.Z - kein Image."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) liegt nicht auf main - kein Image."
            exit 1
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"

  # Kein Image ohne gruene Tests: :dev (main) und :latest (Tag) zieht
  # Watchtower nachts auf Dev/Prod. Gleicher Befehl wie lokal (CLAUDE.md).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock

      # rlPyCairo/pycairo bauen gegen libcairo (wie im Dockerfile)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      # Exakt die Versionen + Hashes aus requirements.lock (wie im Dockerfile).
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      # test_trim.py meldet hier SKIP: books/*_firstkey.pgn ist gitignored,
      # die Snapshot-Regression laeuft nur lokal (NEEDS_BOOKS in run_all.py).
      - name: Run all offline tests
        run: python tests/run_all.py

  # Bekannte Schwachstellen in den gepinnten Abhaengigkeiten: nur Warnung, blockiert kein
  # Image (nicht in needs von build-and-push). Behoben wird per Lock-Update-Commit
  # (pip-compile --generate-hashes, siehe CLAUDE.md).
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: pip-audit (warn-only)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          if ! pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off --desc on; then
            echo "::warning::pip-audit meldet bekannte Schwachstellen in requirements.lock - Lock aktualisieren."
            exit 1
          fi

  build-and-push:
    needs: [release-guard, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.release-guard.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
